<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Something went wrong</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="text-center py-5">
        <div class="display-1 rb-accent fw-bold" th:text="${status != null ? status : 'Oops'}">404</div>
        <h1 class="h3" th:text="${error != null ? error : 'Something went wrong'}">Not Found</h1>
        <p class="text-body-secondary" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Message</p>
        <p class="text-body-secondary" th:unless="${message != null and !#strings.isEmpty(message)}">
            The page you were looking for could not be shown.
        </p>
        <a class="btn btn-primary mt-2" th:href="@{/}"><i class="fa-solid fa-house"></i> Back to recipes</a>
    </div>
</th:block>
</body>
</html>
