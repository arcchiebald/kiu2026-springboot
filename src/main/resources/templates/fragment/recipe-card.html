<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(r)" class="card rb-card h-100">
    <a th:href="@{/recipes/{id}(id=${r.id})}" class="rb-card-media text-decoration-none">
        <img th:if="${r.imageUrl != null}" th:src="@{${r.imageUrl}}" class="card-img-top" th:alt="${r.title}"/>
        <div th:unless="${r.imageUrl != null}" class="rb-placeholder"><i class="fa-solid fa-bowl-food"></i></div>
    </a>
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
            <h2 class="h5 card-title mb-0">
                <a th:href="@{/recipes/{id}(id=${r.id})}" class="stretched-link text-reset text-decoration-none" th:text="${r.title}">Title</a>
            </h2>
            <span class="badge rounded-pill flex-shrink-0"
                  th:classappend="${r.difficulty.name() == 'EASY'} ? 'text-bg-success' : (${r.difficulty.name() == 'MEDIUM'} ? 'text-bg-warning' : 'text-bg-danger')"
                  th:text="${#strings.capitalize(#strings.toLowerCase(r.difficulty))}">Easy</span>
        </div>
        <p class="small text-body-secondary mb-2">
            by <span th:text="${r.chefName}">Chef</span> &middot; <span th:text="${r.categoryName}">Category</span>
        </p>
        <p class="card-text small flex-grow-1" th:if="${r.description != null and !#strings.isEmpty(r.description)}"
           th:text="${#strings.abbreviate(r.description, 110)}">Description</p>
        <div class="d-flex gap-3 small text-body-secondary mt-auto">
            <span><i class="fa-regular fa-clock"></i> <span th:text="${r.cookTimeMinutes}">30</span> min</span>
            <span><i class="fa-solid fa-user-group"></i> <span th:text="${r.servings}">4</span></span>
        </div>
    </div>
</div>
</body>
</html>
