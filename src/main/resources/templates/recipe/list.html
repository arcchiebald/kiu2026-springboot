<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Recipes</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="rb-hero rounded-4 p-4 p-md-5 mb-4">
        <h1 class="display-6 fw-bold mb-1">What shall we cook today?</h1>
        <p class="mb-0 text-body-secondary">Browse, search and share recipes from our chefs.</p>
    </section>

    <form class="card card-body rb-filters mb-4" method="get" th:action="@{/recipes}">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-4">
                <label for="q" class="form-label">Search by title</label>
                <input type="search" class="form-control" id="q" name="q" th:value="${q}" placeholder="e.g. soup"/>
            </div>
            <div class="col-6 col-lg-2">
                <label for="categoryId" class="form-label">Category</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">Any</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${categoryId != null and categoryId == c.id}">Dinner</option>
                </select>
            </div>
            <div class="col-6 col-lg-2">
                <label for="difficulty" class="form-label">Difficulty</label>
                <select class="form-select" id="difficulty" name="difficulty">
                    <option value="">Any</option>
                    <option th:each="d : ${difficulties}" th:value="${d}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(d))}"
                            th:selected="${d == difficulty}">Easy</option>
                </select>
            </div>
            <div class="col-6 col-lg-2">
                <label for="maxTime" class="form-label">Max time (min)</label>
                <input type="number" min="1" max="1440" class="form-control" id="maxTime" name="maxTime" th:value="${maxTime}"/>
            </div>
            <div class="col-6 col-lg-2">
                <label for="tag" class="form-label">Tag</label>
                <input type="text" class="form-control" id="tag" name="tag" th:value="${tag}" placeholder="vegan"/>
            </div>
            <div class="col-12 col-lg-4">
                <label for="sort" class="form-label">Sort by</label>
                <select class="form-select" id="sort" name="sort">
                    <option th:each="o : ${sortOptions}" th:value="${o.key}" th:text="${o.value}"
                            th:selected="${o.key == sort}">Newest first</option>
                </select>
            </div>
            <div class="col-12 col-lg-8 d-flex gap-2 justify-content-lg-end">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                <a th:if="${filtered}" th:href="@{/recipes}" class="btn btn-outline-secondary">Clear filters</a>
            </div>
        </div>
        <div class="mt-3 d-flex flex-wrap align-items-center gap-2" th:if="${!#lists.isEmpty(popularTags)}">
            <span class="small text-body-secondary">Popular tags:</span>
            <a th:each="t : ${popularTags}" th:href="@{/recipes(tag=${t.name})}"
               class="badge rb-tag text-decoration-none" th:text="'#' + ${t.name}">#vegan</a>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="mb-0 text-body-secondary">
            <strong th:text="${recipes.totalElements}">0</strong>
            <span th:text="${recipes.totalElements == 1} ? 'recipe' : 'recipes'">recipes</span>
            <span th:if="${filtered}">match your filters</span>
        </p>
        <p class="mb-0 small text-body-secondary" th:if="${recipes.totalPages > 1}">
            Page <span th:text="${recipes.page + 1}">1</span> of <span th:text="${recipes.totalPages}">3</span>
        </p>
    </div>

    <div th:if="${#lists.isEmpty(recipes.content)}" class="text-center py-5">
        <div class="display-4 rb-accent"><i class="fa-solid fa-plate-wheat"></i></div>
        <h2 class="h4 mt-3">No recipes found</h2>
        <p class="text-body-secondary" th:text="${filtered} ? 'Try loosening your filters.' : 'Be the first to publish one!'">Try loosening your filters.</p>
        <a class="btn btn-primary" th:href="@{/recipes/new}"><i class="fa-solid fa-plus"></i> Add a recipe</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 mb-4" th:unless="${#lists.isEmpty(recipes.content)}">
        <div class="col" th:each="r : ${recipes.content}">
            <div th:replace="~{fragment/recipe-card :: card(${r})}"></div>
        </div>
    </div>

    <div th:replace="~{fragment/pager :: pager(${recipes}, ${'/recipes?' + queryString + '&page='})}"></div>
</th:block>
</body>
</html>
