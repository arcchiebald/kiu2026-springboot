<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Chefs</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">Chefs</h1>
        <a class="btn btn-primary" th:href="@{/chefs/new}"><i class="fa-solid fa-user-plus"></i> Add chef</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div th:if="${#lists.isEmpty(chefs.content)}" class="text-body-secondary">No chefs yet.</div>
            <div class="row row-cols-1 row-cols-md-2 g-3 mb-4">
                <div class="col" th:each="c : ${chefs.content}">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <h2 class="h5 card-title">
                                <a th:href="@{/chefs/{id}(id=${c.id})}" class="text-reset text-decoration-none" th:text="${c.name}">Name</a>
                            </h2>
                            <p class="small text-body-secondary mb-2"><i class="fa-regular fa-envelope"></i> <span th:text="${c.email}">a@b.c</span></p>
                            <p class="card-text small flex-grow-1" th:text="${c.bio}" th:if="${c.bio != null}">Bio</p>
                            <div class="d-flex gap-2 mt-2">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/chefs/{id}(id=${c.id})}">View recipes</a>
                                <form th:action="@{/chefs/{id}/delete(id=${c.id})}" method="post"
                                      onsubmit="return confirm('Delete this chef?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragment/pager :: pager(${chefs}, '/chefs?page=')}"></div>
        </div>

        <aside class="col-lg-4">
            <div class="card card-body">
                <h2 class="h5"><i class="fa-solid fa-trophy rb-accent"></i> Top chefs</h2>
                <p class="small text-body-secondary" th:if="${#lists.isEmpty(topChefs)}">Nobody has published yet.</p>
                <ol class="list-group list-group-numbered list-group-flush" th:unless="${#lists.isEmpty(topChefs)}">
                    <li class="list-group-item d-flex justify-content-between align-items-start" th:each="t : ${topChefs}">
                        <a class="ms-2 me-auto text-reset" th:href="@{/chefs/{id}(id=${t.chefId})}" th:text="${t.name}">Name</a>
                        <span class="badge rb-pill" th:text="${t.recipeCount} + (${t.recipeCount == 1} ? ' recipe' : ' recipes')">3 recipes</span>
                    </li>
                </ol>
            </div>
        </aside>
    </div>
</th:block>
</body>
</html>
