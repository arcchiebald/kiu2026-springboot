<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add chef</title>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="h2 mb-4">Add a chef</h1>
    <form th:object="${chefForm}" th:action="@{/chefs}" method="post" novalidate class="card card-body col-lg-6">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" maxlength="100"/>
            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid" maxlength="150"/>
            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
        </div>
        <div class="mb-3">
            <label for="bio" class="form-label">Bio <span class="text-body-secondary">(optional)</span></label>
            <textarea class="form-control" id="bio" rows="3" th:field="*{bio}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{bio}">Bio error</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Add chef</button>
            <a class="btn btn-outline-secondary" th:href="@{/chefs}">Cancel</a>
        </div>
    </form>
</th:block>
</body>
</html>
