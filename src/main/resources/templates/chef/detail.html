<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${chef.name}">Chef</title>
</head>
<body>
<th:block layout:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/chefs}">Chefs</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${chef.name}">Name</li>
        </ol>
    </nav>
    <section class="rb-hero rounded-4 p-4 mb-4">
        <h1 class="h2 fw-bold" th:text="${chef.name}">Name</h1>
        <p class="mb-1 text-body-secondary"><i class="fa-regular fa-envelope"></i> <span th:text="${chef.email}">a@b.c</span></p>
        <p class="mb-0" th:if="${chef.bio != null}" th:text="${chef.bio}">Bio</p>
    </section>

    <h2 class="h4 mb-3">Recipes by <span th:text="${chef.name}">Chef</span></h2>
    <p class="text-body-secondary" th:if="${#lists.isEmpty(recipes)}">No recipes published yet.</p>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
        <div class="col" th:each="r : ${recipes}">
            <div th:replace="~{fragment/recipe-card :: card(${r})}"></div>
        </div>
    </div>
</th:block>
</body>
</html>
