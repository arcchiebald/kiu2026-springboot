spring.application.name=recipes

# H2 (file-based, persists between runs)
spring.datasource.url=jdbc:h2:file:./data/recipesdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Web UI: keep the session id out of redirect URLs (flash messages use the session)
server.servlet.session.tracking-modes=cookie

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# Pagination guard rails (applies to Pageable request parameters)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Demo data on first start (only when the database is empty)
app.seed-data=true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
